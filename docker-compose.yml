services:
  timeshift:
    # To build locally, uncomment the line below and comment out the 'image' line
    build: .
    container_name: timeshift
    # Use pre-built image from GitHub Container Registry
    # image: ghcr.io/playcz/ffmpeg-timeshift:main
    environment:
      STREAM_ID: "brno"
      ICECAST_URL: "https://rozhlas.stream/brno_high.aac"

      # Audio settings
      AUDIO_SR: "48000"
      AUDIO_CH: "2"
      AAC_BITRATE: "64k"

      # Timeshift settings
      SEG_SECONDS: "60"
      HISTORY_HOURS: "1"
      UTC_MODE: "1"

      # Update interval for manifest regeneration
      STITCH_INTERVAL_SEC: "10"
    volumes:
      - /Users/ladasoukup/.tmpdisk/tmp:/out
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
