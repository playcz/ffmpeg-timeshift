x-transcoder-env: &transcoder-env
  TIME_SHIFT_BUFFER_DEPTH: "43200"
  SEGMENT_DURATION: "60"
  AUDIO_BITRATE: "64k"
  AUDIO_SAMPLE_RATE: "48000"
  AUDIO_CHANNELS: "2"
  STITCHER_POLL_INTERVAL: "5"
  CLEANER_INTERVAL: "60"

x-transcoder-base: &transcoder-base
  environment: *transcoder-env
  build: .
  # image: ghcr.io/playcz/ffmpeg-timeshift:main

  volumes:
    - /Users/ladasoukup/.tmpdisk/tmp:/output
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "2"
  deploy:
    mode: replicated
    replicas: 1
    placement:
      preferences:
        - spread: node.id
    restart_policy:
      condition: any
      delay: 10s
      max_attempts: 0
      window: 120s
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

services:
  transcoder-radiozurnal:
    <<: *transcoder-base
    environment:
      <<: *transcoder-env
      STREAM_ID: "radiozurnal"
      ICECAST_URL: "https://rozhlas.stream/radiozurnal_high.aac"
      UDP_PORT: "40001"

  # Example additional stream instance
